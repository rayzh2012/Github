name: Fangame Play Ready

on:
  push:
    paths:
      - '.github/workflows/fangame-play-ready.yml'
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Skip source rebuild and restore the newest last-known-good artifact from master'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: xiaotanxuexiao
            title: 笑谈学校
            url: https://99dj.197784.com/9dj2/f/xiaotanxuexiao.rar
            sha256: b601f9f602dcfdd3cbd5fedd190fd10403a72f9cba4fc0223d7fe07f39da6b97
          - slug: jionghun
            title: 囧魂
            url: https://99dj.197784.com/9dj1/JiongHun.rar
            sha256: 08fe10490b9dac47a85e2a7f2bc5bdeb47714e6102aeb9698b29aa52b1811df9
          - slug: lingerxuzhuan
            title: 仙剑奇侠传：灵儿续传
            url: https://99dj.197784.com/9dj2/f/lingerxuzhuan.rar
            sha256: a821c80d6eba4ae25f8740e84dd897a5cec65b3aee8dea87ce4d4a4b31b573f0
    steps:
      - name: Try current source build
        id: current
        if: github.event_name != 'workflow_dispatch' || inputs.force_rollback != true
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          # Temporary branch-only chaos test: prove xiaotanxuexiao can recover from a hard current-build failure.
          if [ "$GITHUB_REF_NAME" = 'fix/fangame-play-ready-rollback' ] && [ '${{ matrix.slug }}' = 'xiaotanxuexiao' ]; then
            echo 'Intentional rollback-path test for xiaotanxuexiao' >&2
            exit 86
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unrar || sudo apt-get install -y -qq p7zip-full

          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 1800 \
            '${{ matrix.url }}' -o source.rar
          ls -lh source.rar
          echo '${{ matrix.sha256 }}  source.rar' | sha256sum -c -

          rm -rf PLAY_READY
          mkdir -p 'PLAY_READY/${{ matrix.slug }}'
          if command -v unrar >/dev/null 2>&1; then
            unrar x -o+ source.rar 'PLAY_READY/${{ matrix.slug }}/'
          else
            7z x source.rar '-oPLAY_READY/${{ matrix.slug }}' -y
          fi
          rm -f source.rar

          ROOT='PLAY_READY/${{ matrix.slug }}'
          {
            echo 'Title: ${{ matrix.title }}'
            echo 'Engine: RPG Maker XP'
            echo 'Source SHA256: ${{ matrix.sha256 }}'
            echo 'Packaged by GitHub Actions for direct-play convenience.'
            echo
            echo 'Launch candidates:'
            find "$ROOT" -type f \( -iname 'game.exe' -o -iname '*.exe' \) -print | head -30
            echo
            echo 'RPG Maker markers:'
            find "$ROOT" -type f \( -iname 'game.ini' -o -iname 'game.rxproj' -o -iname '*.rgssad' \) -print | head -30
          } > "$ROOT/PLAY_READY_MANIFEST.txt"
          echo '--- manifest ---'
          cat "$ROOT/PLAY_READY_MANIFEST.txt"

          EXE_COUNT=$(find "$ROOT" -type f -iname '*.exe' | wc -l)
          if [ "$EXE_COUNT" -lt 1 ]; then
            echo 'No executable found after extraction' >&2
            exit 1
          fi

      - name: Roll back to last known-good artifact
        id: rollback
        if: steps.current.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.force_rollback == true)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ matrix.slug }}_PLAY_READY
        shell: bash
        run: |
          set -euo pipefail

          echo "Current package is unavailable; looking for last known-good ${ARTIFACT_NAME} on master."
          rm -rf PLAY_READY
          mkdir -p PLAY_READY

          SOURCE_RUN=''
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue

            artifact_id=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.expired == false and .name == \"${ARTIFACT_NAME}\") | .id" \
              | head -n 1 || true)

            if [ -n "$artifact_id" ]; then
              echo "Found ${ARTIFACT_NAME} in run ${run_id}; restoring it."
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D PLAY_READY; then
                EXE_COUNT=$(find PLAY_READY -type f -iname '*.exe' | wc -l)
                if [ "$EXE_COUNT" -ge 1 ]; then
                  SOURCE_RUN="$run_id"
                  break
                fi
              fi
              echo "Artifact from run ${run_id} did not validate; trying an older run."
              rm -rf PLAY_READY
              mkdir -p PLAY_READY
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow 'Fangame Play Ready' \
              --branch master \
              --limit 50 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          if [ -z "$SOURCE_RUN" ]; then
            echo "No non-expired last-known-good artifact named ${ARTIFACT_NAME} was found on master." >&2
            exit 1
          fi

          cat > PLAY_READY/ROLLBACK_PROVENANCE.txt <<EOF
          artifact=${ARTIFACT_NAME}
          source_run=${SOURCE_RUN}
          restored_by_run=${GITHUB_RUN_ID}
          restored_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          echo "source_run=${SOURCE_RUN}" >> "$GITHUB_OUTPUT"
          {
            echo '### PLAY_READY rollback used'
            echo
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Source run: \`${SOURCE_RUN}\`"
            echo "- Restored by run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record current build
        if: steps.current.outcome == 'success'
        shell: bash
        run: |
          {
            echo '### PLAY_READY current source build succeeded'
            echo
            echo '- Artifact: `${{ matrix.slug }}_PLAY_READY`'
            echo '- Rollback used: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload play-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}_PLAY_READY
          path: PLAY_READY/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Report run id
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_SOURCE_RUN: ${{ steps.rollback.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ROLLBACK_OUTCOME" = 'success' ]; then
            rollback_used=true
          else
            rollback_used=false
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "PLAY_READY_RESULT ${{ matrix.slug }} run ${GITHUB_RUN_ID}" \
            --body "slug=${{ matrix.slug }}%0Atitle=${{ matrix.title }}%0Arun_id=${GITHUB_RUN_ID}%0Asha256=${{ matrix.sha256 }}%0Arollback_used=${rollback_used}%0Arollback_source_run=${ROLLBACK_SOURCE_RUN}"
